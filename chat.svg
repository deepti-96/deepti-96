<svg width="560" height="340" viewBox="0 0 560 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .bar { fill: #161b22; }
    .bubble-l { fill: #2d1f45; }
    .bubble-r { fill: #a855f7; }
    .dot-l { fill: #7c4dff; }
    .dot-r { fill: #ffffff; }
    text {
      fill: #e2d9f3;
      font-size: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .t-right { fill: #ffffff; }
    .t-link  { fill: #00e5ff; }
    .t-dim   { fill: #8b949e; font-size: 12px; }

    /* typing indicators */
    .ty1 { opacity:0; animation: fio 1.4s 0s; }
    .ty2 { opacity:0; animation: fio 1.4s 2.2s; }
    .ty3 { opacity:0; animation: fio 1.4s 4.4s; }
    .ty4 { opacity:0; animation: fio 1.4s 6.4s; }
    .ty5 { opacity:0; animation: fio 1.4s 8.4s; }

    /* messages */
    .m1  { opacity:0; animation: pop 0.25s 1.6s forwards; }
    .m2  { opacity:0; animation: pop 0.25s 3.8s forwards; }
    .m3  { opacity:0; animation: pop 0.25s 6.0s forwards; }
    .m4  { opacity:0; animation: pop 0.25s 8.0s forwards; }
    .m5  { opacity:0; animation: pop 0.25s 10.0s forwards; }

    @keyframes fio {
      0%,100% { opacity:0; }
      20%,80% { opacity:1; }
    }
    @keyframes pop {
      from { opacity:0; transform: translateY(5px); }
      to   { opacity:1; transform: translateY(0); }
    }
  </style>

  <!-- background -->
  <rect width="560" height="340" rx="14" class="bg"/>

  <!-- top bar -->
  <rect width="560" height="40" rx="14" class="bar"/>
  <rect y="26" width="560" height="14" class="bar"/>
  <circle cx="18" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="20" r="5" fill="#28c840"/>
  <text x="280" y="25" text-anchor="middle" class="t-dim">deepti-96 · Messages</text>

  <!-- ── ROW 1 left: "Hi, I'm Deepti 👋" ── -->
  <!-- typing -->
  <g class="ty1" transform="translate(14,52)">
    <rect x="6" y="0" width="58" height="32" rx="16" class="bubble-l"/>
    <circle cx="10" cy="24" r="5" class="bubble-l"/>
    <circle cx="3"  cy="30" r="3" class="bubble-l"/>
    <circle cx="22" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="34" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" begin="0.15s" repeatCount="indefinite"/></circle>
    <circle cx="46" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
  <!-- message -->
  <g class="m1" transform="translate(14,52)">
    <rect width="178" height="32" rx="16" class="bubble-l"/>
    <circle cx="0"  cy="24" r="5" class="bubble-l"/>
    <circle cx="-7" cy="30" r="3" class="bubble-l"/>
    <text x="12" y="21">Hi, I'm Deepti 👋</text>
  </g>

  <!-- ── ROW 2 left: role ── -->
  <g class="ty2" transform="translate(14,96)">
    <rect x="6" y="0" width="58" height="32" rx="16" class="bubble-l"/>
    <circle cx="10" cy="24" r="5" class="bubble-l"/>
    <circle cx="3"  cy="30" r="3" class="bubble-l"/>
    <circle cx="22" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="34" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" begin="0.15s" repeatCount="indefinite"/></circle>
    <circle cx="46" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
  <g class="m2" transform="translate(14,96)">
    <rect width="320" height="32" rx="16" class="bubble-l"/>
    <circle cx="0"  cy="24" r="5" class="bubble-l"/>
    <circle cx="-7" cy="30" r="3" class="bubble-l"/>
    <text x="12" y="21">MS CS @ ASU · Ex-Oracle Developer</text>
  </g>

  <!-- ── ROW 3 left: focus ── -->
  <g class="ty3" transform="translate(14,140)">
    <rect x="6" y="0" width="58" height="32" rx="16" class="bubble-l"/>
    <circle cx="10" cy="24" r="5" class="bubble-l"/>
    <circle cx="3"  cy="30" r="3" class="bubble-l"/>
    <circle cx="22" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="34" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" begin="0.15s" repeatCount="indefinite"/></circle>
    <circle cx="46" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
  <g class="m3" transform="translate(14,140)">
    <rect width="400" height="32" rx="16" class="bubble-l"/>
    <circle cx="0"  cy="24" r="5" class="bubble-l"/>
    <circle cx="-7" cy="30" r="3" class="bubble-l"/>
    <text x="12" y="21">Backend · Distributed Systems · AI/ML</text>
  </g>

  <!-- ── ROW 4 right: recruiter ── -->
  <g class="ty4" transform="translate(400,184)">
    <rect x="6" y="0" width="58" height="32" rx="16" class="bubble-r"/>
    <circle cx="60" cy="24" r="5" class="bubble-r"/>
    <circle cx="67" cy="30" r="3" class="bubble-r"/>
    <circle cx="18" cy="16" r="3.5" class="dot-r" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="16" r="3.5" class="dot-r" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="0.8s" begin="0.15s" repeatCount="indefinite"/></circle>
    <circle cx="42" cy="16" r="3.5" class="dot-r" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="0.8s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
  <g class="m4" transform="translate(330,184)">
    <rect width="216" height="32" rx="16" class="bubble-r"/>
    <circle cx="216" cy="24" r="5" class="bubble-r"/>
    <circle cx="223" cy="30" r="3" class="bubble-r"/>
    <text x="12" y="21" class="t-right">Cool! What do you build?</text>
  </g>

  <!-- ── ROW 5 left: reply + contact ── -->
  <g class="ty5" transform="translate(14,228)">
    <rect x="6" y="0" width="58" height="32" rx="16" class="bubble-l"/>
    <circle cx="10" cy="24" r="5" class="bubble-l"/>
    <circle cx="3"  cy="30" r="3" class="bubble-l"/>
    <circle cx="22" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="34" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" begin="0.15s" repeatCount="indefinite"/></circle>
    <circle cx="46" cy="16" r="3.5" class="dot-l"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
  <g class="m5" transform="translate(14,228)">
    <rect width="510" height="60" rx="16" class="bubble-l"/>
    <circle cx="0"  cy="50" r="5" class="bubble-l"/>
    <circle cx="-7" cy="57" r="3" class="bubble-l"/>
    <text x="12" y="24">AI tools, distributed systems &amp; accessible tech 🚀</text>
    <text x="12" y="47" class="t-link">deeptiravikumar@gmail.com · linkedin.com/in/deepti-ravi-kumar</text>
  </g>

</svg>
