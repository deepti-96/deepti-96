      <circle cx="0" cy="28" r="6" class="bubble-left"/>
      <circle cx="-8" cy="35" r="3" class="bubble-left"/>
      <text x="14" y="24">Backend Engineering · Distributed Systems · AI</text>
    </g>
  </g>

  <!-- TYPING 4 (right side — recruiter asks) -->
  <g transform="translate(390, 196)" class="typing-4">
    <rect x="8" width="62" height="36" rx="18" class="bubble-right"/>
    <circle cx="62" cy="28" r="6" class="bubble-right"/>
    <circle cx="70" cy="35" r="3" class="bubble-right"/>
    <circle cx="20" cy="18" r="4" fill="#ffffff" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="33" cy="18" r="4" fill="#ffffff" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="0.9s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="18" r="4" fill="#ffffff" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="0.9s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- MSG 4 (right): Cool! What do you build? -->
  <g class="msg-4">
    <g transform="translate(326, 196)">
      <rect width="220" height="36" rx="18" class="bubble-right"/>
      <circle cx="220" cy="28" r="6" class="bubble-right"/>
      <circle cx="228" cy="35" r="3" class="bubble-right"/>
      <text x="14" y="24" class="text-right">Cool! What do you build?</text>
    </g>
  </g>

  <!-- TYPING 5 -->
  <g transform="translate(14, 242)" class="typing-5">
    <rect x="8" width="62" height="36" rx="18" class="bubble-left"/>
    <circle cx="12" cy="28" r="6" class="bubble-left"/>
    <circle cx="4" cy="35" r="3" class="bubble-left"/>
    <circle cx="26" cy="18" r="4" fill="#7c4dff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="39" cy="18" r="4" fill="#7c4dff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="0.9s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="18" r="4" fill="#7c4dff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="0.9s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- MSG 5: AI tools, distributed systems & accessible tech -->
  <g class="msg-5">
    <g transform="translate(14, 242)">
      <rect width="450" height="36" rx="18" class="bubble-left"/>
      <circle cx="0" cy="28" r="6" class="bubble-left"/>
      <circle cx="-8" cy="35" r="3" class="bubble-left"/>
      <text x="14" y="24">AI tools, distributed systems &amp; accessible tech 🚀</text>
    </g>
