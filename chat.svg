  <!-- MSG 6: reach out -->
  <g class="msg-6">
    <g transform="translate(14, 290)">
      <rect width="510" height="36" rx="18" class="bubble-left"/>
      <circle cx="0" cy="28" r="6" class="bubble-left"/>
      <circle cx="-8" cy="35" r="3" class="bubble-left"/>
      <text x="14" y="24">Reach me at <a xlink:href="mailto:deeptiravikumar@gmail.com">deeptiravikumar@gmail.com</a> or <a xlink:href="https://www.linkedin.com/in/deepti-ravi-kumar/">LinkedIn</a> 🙌</text>
    </g>
  </g>

</svg>
