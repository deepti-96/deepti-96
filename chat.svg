<svg width="560" height="340" viewBox="0 0 560 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      fill: #e2d9f3;
    }
    .t-right { fill: #ffffff; }
    .t-dim   { fill: #8b949e; font-size: 12px; }
    .t-link  { fill: #00e5ff; font-size: 13px; text-decoration: underline; }
 
    .d1 { animation: pulse 0.7s 0s infinite; }
    .d2 { animation: pulse 0.7s 0.15s infinite; }
    .d3 { animation: pulse 0.7s 0.3s infinite; }
    @keyframes pulse { 0%,100%{opacity:0.2;} 50%{opacity:1;} }
 
    /* 99s loop trick — messages stay visible once appeared */
    /* ty = typing indicator, m = message bubble */
    /* Timeline:
       0.0  ty1   1.4  m1
       2.4  ty2   3.8  m2
       4.8  ty3   6.2  m3
       7.2  ty4   8.6  m4
       9.6  ty5  11.0  m5
      12.0  ty6  13.4  m6
    */
 
    .ty1{animation:ty1 99s linear infinite;} .m1{animation:m1 99s linear infinite;}
    .ty2{animation:ty2 99s linear infinite;} .m2{animation:m2 99s linear infinite;}
    .ty3{animation:ty3 99s linear infinite;} .m3{animation:m3 99s linear infinite;}
    .ty4{animation:ty4 99s linear infinite;} .m4{animation:m4 99s linear infinite;}
    .ty5{animation:ty5 99s linear infinite;} .m5{animation:m5 99s linear infinite;}
    .ty6{animation:ty6 99s linear infinite;} .m6{animation:m6 99s linear infinite;}
 
    @keyframes ty1{0%{opacity:0;}0.01%{opacity:1;}1.41%{opacity:1;}1.42%{opacity:0;}100%{opacity:0;}}
    @keyframes m1 {0%{opacity:0;}1.41%{opacity:0;}1.42%{opacity:1;}100%{opacity:1;}}
 
    @keyframes ty2{0%{opacity:0;}2.42%{opacity:0;}2.43%{opacity:1;}3.83%{opacity:1;}3.84%{opacity:0;}100%{opacity:0;}}
    @keyframes m2 {0%{opacity:0;}3.83%{opacity:0;}3.84%{opacity:1;}100%{opacity:1;}}
 
    @keyframes ty3{0%{opacity:0;}4.84%{opacity:0;}4.85%{opacity:1;}6.26%{opacity:1;}6.27%{opacity:0;}100%{opacity:0;}}
    @keyframes m3 {0%{opacity:0;}6.26%{opacity:0;}6.27%{opacity:1;}100%{opacity:1;}}
 
    @keyframes ty4{0%{opacity:0;}7.27%{opacity:0;}7.28%{opacity:1;}8.68%{opacity:1;}8.69%{opacity:0;}100%{opacity:0;}}
    @keyframes m4 {0%{opacity:0;}8.68%{opacity:0;}8.69%{opacity:1;}100%{opacity:1;}}
 
    @keyframes ty5{0%{opacity:0;}9.69%{opacity:0;}9.70%{opacity:1;}11.11%{opacity:1;}11.12%{opacity:0;}100%{opacity:0;}}
    @keyframes m5 {0%{opacity:0;}11.11%{opacity:0;}11.12%{opacity:1;}100%{opacity:1;}}
 
    @keyframes ty6{0%{opacity:0;}12.12%{opacity:0;}12.13%{opacity:1;}13.53%{opacity:1;}13.54%{opacity:0;}100%{opacity:0;}}
    @keyframes m6 {0%{opacity:0;}13.53%{opacity:0;}13.54%{opacity:1;}100%{opacity:1;}}
  </style>
 
  <!-- Background -->
  <rect width="560" height="340" rx="14" fill="#0d1117"/>
  <rect width="560" height="40" rx="14" fill="#161b22"/>
  <rect y="26" width="560" height="14" fill="#161b22"/>
  <circle cx="18" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="20" r="5" fill="#28c840"/>
  <text x="280" y="25" text-anchor="middle" class="t-dim">deepti-96 · Messages</text>
 
  <!-- TYPING 1 -->
  <g class="ty1" transform="translate(14,52)">
    <rect x="6" width="56" height="30" rx="15" fill="#2d1f45"/>
    <circle cx="10" cy="22" r="5" fill="#2d1f45"/><circle cx="3" cy="28" r="3" fill="#2d1f45"/>
    <circle cx="21" cy="15" r="3" fill="#7c4dff" class="d1"/>
    <circle cx="33" cy="15" r="3" fill="#7c4dff" class="d2"/>
    <circle cx="45" cy="15" r="3" fill="#7c4dff" class="d3"/>
  </g>
  <!-- MSG 1 -->
  <g class="m1" transform="translate(14,52)">
    <rect width="182" height="30" rx="15" fill="#2d1f45"/>
    <circle cx="0" cy="22" r="5" fill="#2d1f45"/><circle cx="-7" cy="28" r="3" fill="#2d1f45"/>
    <text x="12" y="20">Hi, I'm Deepti 👋</text>
  </g>
 
  <!-- TYPING 2 -->
  <g class="ty2" transform="translate(14,94)">
    <rect x="6" width="56" height="30" rx="15" fill="#2d1f45"/>
    <circle cx="10" cy="22" r="5" fill="#2d1f45"/><circle cx="3" cy="28" r="3" fill="#2d1f45"/>
    <circle cx="21" cy="15" r="3" fill="#7c4dff" class="d1"/>
    <circle cx="33" cy="15" r="3" fill="#7c4dff" class="d2"/>
    <circle cx="45" cy="15" r="3" fill="#7c4dff" class="d3"/>
  </g>
  <!-- MSG 2 -->
  <g class="m2" transform="translate(14,94)">
    <rect width="322" height="30" rx="15" fill="#2d1f45"/>
    <circle cx="0" cy="22" r="5" fill="#2d1f45"/><circle cx="-7" cy="28" r="3" fill="#2d1f45"/>
    <text x="12" y="20">MS CS @ ASU · Ex-Oracle Developer</text>
  </g>
 
  <!-- TYPING 3 -->
  <g class="ty3" transform="translate(14,136)">
    <rect x="6" width="56" height="30" rx="15" fill="#2d1f45"/>
    <circle cx="10" cy="22" r="5" fill="#2d1f45"/><circle cx="3" cy="28" r="3" fill="#2d1f45"/>
    <circle cx="21" cy="15" r="3" fill="#7c4dff" class="d1"/>
    <circle cx="33" cy="15" r="3" fill="#7c4dff" class="d2"/>
    <circle cx="45" cy="15" r="3" fill="#7c4dff" class="d3"/>
  </g>
  <!-- MSG 3 -->
  <g class="m3" transform="translate(14,136)">
    <rect width="366" height="30" rx="15" fill="#2d1f45"/>
    <circle cx="0" cy="22" r="5" fill="#2d1f45"/><circle cx="-7" cy="28" r="3" fill="#2d1f45"/>
    <text x="12" y="20">Backend · Distributed Systems · AI/ML</text>
  </g>
 
  <!-- TYPING 4 (right) -->
  <g class="ty4" transform="translate(492,178)">
    <rect x="-62" width="56" height="30" rx="15" fill="#a855f7"/>
    <circle cx="-6" cy="22" r="5" fill="#a855f7"/><circle cx="1" cy="28" r="3" fill="#a855f7"/>
    <circle cx="-49" cy="15" r="3" fill="#ffffff" opacity="0.7" class="d1"/>
    <circle cx="-37" cy="15" r="3" fill="#ffffff" opacity="0.7" class="d2"/>
    <circle cx="-25" cy="15" r="3" fill="#ffffff" opacity="0.7" class="d3"/>
  </g>
  <!-- MSG 4 (right) -->
  <g class="m4" transform="translate(336,178)">
    <rect width="210" height="30" rx="15" fill="#a855f7"/>
    <circle cx="210" cy="22" r="5" fill="#a855f7"/><circle cx="217" cy="28" r="3" fill="#a855f7"/>
    <text x="12" y="20" class="t-right">Cool! What do you build?</text>
  </g>
 
  <!-- TYPING 5 -->
  <g class="ty5" transform="translate(14,220)">
    <rect x="6" width="56" height="30" rx="15" fill="#2d1f45"/>
    <circle cx="10" cy="22" r="5" fill="#2d1f45"/><circle cx="3" cy="28" r="3" fill="#2d1f45"/>
    <circle cx="21" cy="15" r="3" fill="#7c4dff" class="d1"/>
    <circle cx="33" cy="15" r="3" fill="#7c4dff" class="d2"/>
    <circle cx="45" cy="15" r="3" fill="#7c4dff" class="d3"/>
  </g>
  <!-- MSG 5 -->
  <g class="m5" transform="translate(14,220)">
    <rect width="420" height="30" rx="15" fill="#2d1f45"/>
    <circle cx="0" cy="22" r="5" fill="#2d1f45"/><circle cx="-7" cy="28" r="3" fill="#2d1f45"/>
    <text x="12" y="20">AI tools, distributed systems &amp; accessible tech 🚀</text>
  </g>
 
  <!-- TYPING 6 -->
  <g class="ty6" transform="translate(14,262)">
    <rect x="6" width="56" height="30" rx="15" fill="#2d1f45"/>
    <circle cx="10" cy="22" r="5" fill="#2d1f45"/><circle cx="3" cy="28" r="3" fill="#2d1f45"/>
    <circle cx="21" cy="15" r="3" fill="#7c4dff" class="d1"/>
    <circle cx="33" cy="15" r="3" fill="#7c4dff" class="d2"/>
    <circle cx="45" cy="15" r="3" fill="#7c4dff" class="d3"/>
  </g>
  <!-- MSG 6 — reach out with clickable links -->
  <g class="m6" transform="translate(14,262)">
    <rect width="400" height="30" rx="15" fill="#2d1f45"/>
    <circle cx="0" cy="22" r="5" fill="#2d1f45"/><circle cx="-7" cy="28" r="3" fill="#2d1f45"/>
    <text x="12" y="20" fill="#e2d9f3" font-family="-apple-system,sans-serif" font-size="15px">Feel free to reach out via&#160;</text>
    <a xlink:href="mailto:deeptiravikumar@gmail.com" xmlns:xlink="http://www.w3.org/1999/xlink"><text x="189" y="20" style="fill:#4493f8;text-decoration:underline;font-family:-apple-system,sans-serif;font-size:15px;">Email</text></a>
    <text x="224" y="20" fill="#e2d9f3" font-family="-apple-system,sans-serif" font-size="15px">&#160;or&#160;</text>
    <a xlink:href="https://www.linkedin.com/in/deepti-ravi-kumar/" xmlns:xlink="http://www.w3.org/1999/xlink"><text x="249" y="20" style="fill:#4493f8;text-decoration:underline;font-family:-apple-system,sans-serif;font-size:15px;">LinkedIn</text></a>
    <text x="313" y="20" fill="#e2d9f3" font-family="-apple-system,sans-serif" font-size="15px">&#160;🙌</text>
  </g>
 
</svg>
